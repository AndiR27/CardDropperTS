services:
  backend:
    build:
      context: ./Backend_CardDropper
      dockerfile: src/main/docker/Dockerfile.jvm
      target: runtime
    image: zackrey27/carddropper-backend
    container_name: carddropper-backend
    environment:
      # ==========================
      # Base de données
      # ==========================
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}

      # ==========================
      # JPA / Hibernate
      # ==========================
      SPRING_JPA_DDL_AUTO: validate

      # ==========================
      # Keycloak / OAuth2
      # ==========================
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}

      # ==========================
      # CORS (front Angular)
      # ==========================
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://carddropper.ch}

      # ==========================
      # Logs
      # ==========================
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # ==========================
      # Card images
      # ==========================
      CARD_IMAGES_DIR: /data/card-images
      TZ: Europe/Zurich
      JAVA_OPTS: -Duser.timezone=Europe/Zurich
    volumes:
      - carddropper-images:/data/card-images
    restart: unless-stopped
    networks:
      - proxy
      - db-network
      - monitoring

  frontend:
    build:
      context: ./Frontend_CardDropper
      dockerfile: Dockerfile
    image: zackrey27/carddropper-frontend
    container_name: carddropper-frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - proxy


  # ══════════════════════════════════════════
  # NOUVEAUX SERVICES : MONITORING
  # ══════════════════════════════════════════

  # Prometheus — collecte les métriques toutes les 15s
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - /volume1/docker/carddropper/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
      - proxy
      - db-network
      - keycloak_default

  # Exporter PostgreSQL — base CardDropper
  postgres-exporter-carddropper:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-carddropper
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://root:${SPRING_DATASOURCE_PASSWORD}@PostgreSQL:5432/CardDropper?sslmode=disable"
    networks:
      - monitoring
      - db-network

  # Exporter PostgreSQL — base Keycloak
  postgres-exporter-keycloak:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-keycloak
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://keycloakuser:keycloakpass@Keycloak-DB:5432/keycloak?sslmode=disable"
    networks:
      - monitoring
      - keycloak_default

volumes:
  carddropper-images:
  prometheus_data:

networks:
  proxy:
    external: true
  db-network:
    external: true
    name: postgresql_default
  monitoring:
    external: true
  keycloak_default:
    external: true
