global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # ── Spring Boot Backend ──
  # Métriques JVM, HTTP, threads, mémoire, GC
  - job_name: 'carddropper-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['carddropper-backend:8080']
        labels:
          app: 'carddropper-backend'

  # ── PostgreSQL CardDropper ──
  # Connexions, transactions, I/O, locks, taille des tables
  - job_name: 'postgres-carddropper'
    static_configs:
      - targets: ['postgres-exporter-carddropper:9187']
        labels:
          db: 'CardDropper'

  # ── PostgreSQL Keycloak ──
  - job_name: 'postgres-keycloak'
    static_configs:
      - targets: ['postgres-exporter-keycloak:9187']
        labels:
          db: 'keycloak'

  # ── Prometheus lui-même ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']